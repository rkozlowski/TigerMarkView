name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AVALONIA_TELEMETRY_OPTOUT: '1'

jobs:
  windows:
    name: Windows build and test
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Verify release workflow scripts are tracked
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $requiredScripts = @(
            'eng/release-automation/Install-InnoSetup.ps1'
            'eng/release-automation/Assert-ProductMetadata.ps1'
            'eng/release-automation/Assert-Installer.ps1'
            'eng/release-automation/New-ReleaseArtifactManifest.ps1'
            'eng/release-automation/Assert-ReleaseArtifactManifest.ps1'
            'eng/release-automation/Publish-GitHubDraftRelease.ps1'
            'installer/Build-Installer.ps1'
            'eng/winget/TigerMarkViewWinGet.ps1'
            'eng/winget/Prepare-TigerMarkViewWinGet.ps1'
            'eng/winget/Assert-TigerMarkViewWinGetSubmission.ps1'
          )
          foreach ($path in $requiredScripts) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Required release workflow script is missing: $path"
            }
            git ls-files --error-unmatch -- $path | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Required release workflow script is not tracked: $path" }
          }

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TigerMarkView.slnx -m:1

      - name: Build with zero warnings
        run: >-
          dotnet build TigerMarkView.slnx
          --configuration Release
          --no-restore
          -p:ContinuousIntegrationBuild=true
          -m:1
          /nodeReuse:false

      - name: Test
        run: >-
          dotnet test TigerMarkView.slnx
          --configuration Release
          --no-restore
          --no-build
          --logger "console;verbosity=normal"
          -m:1
          /nodeReuse:false

      - name: Test WinGet manifest generation and submission sealing
        shell: pwsh
        run: ./eng/winget/tests/TigerMarkViewWinGet.Tests.ps1

      - name: Verify tracked-file whitespace
        run: git diff --check
